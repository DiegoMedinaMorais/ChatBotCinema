<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatBot Cinema</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="chat-container">
    <h1>🎬 Assistente do Cinema</h1>
    <p class="subtitulo">Pergunte sobre filmes em cartaz, séries, horários e sessões.</p>
    <div id="chat-box" class="chat-box"></div>
    <form id="chat-form">
      <input
        type="text"
        id="input-mensagem"
        placeholder="Ex: quais filmes estão em cartaz hoje?"
        autocomplete="off"
      />
      <button type="submit">Enviar</button>
    </form>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
